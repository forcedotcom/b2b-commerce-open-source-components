<template lwc:render-mode="light">
    <fieldset class={sectionClass}>
        <legend class="a11y-legend">
            <h2>{a11yTitle}</h2>
        </legend>
        <header>
            <div
                slot="title"
                data-automation="title"
                class="title">
                <slot name="title"></slot>
            </div>
            <div
                slot="edit"
                data-automation="edit"
                onclick={handleEdit}
                class={_editClasses}>
                <slot name="edit"></slot>
            </div>
        </header>
        <div
            slot="content"
            data-automation="content"
            onnavtosplitship={handleNavToSplitShip}>
            <slot name="content"></slot>
        </div>
    </fieldset>
</template>
