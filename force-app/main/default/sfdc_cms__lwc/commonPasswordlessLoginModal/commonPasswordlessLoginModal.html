<template>
    <lightning-modal-header label={labels.modalHeader}></lightning-modal-header>
    <lightning-modal-body>
        <div class="slds-p-top_x-large slds-p-bottom_medium">
            <template lwc:if={showLogo}>
                <div class="comm-passwordless-login-form__logo">
                    <img
                        src={logoUrl}
                        alt=""
                        width="200" />
                </div>
            </template>
        </div>
        <div class="slds-p-bottom_medium slds-text-align_center comm-passwordless-login-form__email-description">
            {descriptionLabel}
        </div>
        <div class="slds-p-bottom_medium comm-passwordless-login-form__passcode-container">
            <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                oninput={handleInput}
                onkeydown={handleKeyDown}
                onpaste={handlePaste}
                class="comm-passwordless-login-form__passcode-segment"
                data-segment="1" />
            <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                oninput={handleInput}
                onkeydown={handleKeyDown}
                onpaste={handlePaste}
                class="comm-passwordless-login-form__passcode-segment"
                data-segment="2" />
            <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                oninput={handleInput}
                onkeydown={handleKeyDown}
                onpaste={handlePaste}
                class="comm-passwordless-login-form__passcode-segment"
                data-segment="3" />
            <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                oninput={handleInput}
                onkeydown={handleKeyDown}
                onpaste={handlePaste}
                class="comm-passwordless-login-form__passcode-segment"
                data-segment="4" />
            <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                oninput={handleInput}
                onkeydown={handleKeyDown}
                onpaste={handlePaste}
                class="comm-passwordless-login-form__passcode-segment"
                data-segment="5" />
            <input
                type="text"
                inputmode="numeric"
                maxlength="1"
                oninput={handleInput}
                onkeydown={handleKeyDown}
                onpaste={handlePaste}
                class="comm-passwordless-login-form__passcode-segment"
                data-segment="6" />
            <template lwc:if={modalShowSpinner}>
                <div class="comm-passwordless-login-form__spinner-container">
                    <lightning-spinner
                        variant="brand"
                        size="x-small"
                        class="comm-passwordless-login-form__spinner"></lightning-spinner>
                </div>
            </template>
        </div>
        <template lwc:if={modalErrorMessage}>
            <div class="slds-p-bottom_x-small comm-passwordless-login-form__error-message slds-align_absolute-center">
                {modalErrorMessage}
            </div>
        </template>
        <template lwc:if={showTextButton}>
            <div class="slds-p-bottom_x-small slds-align_absolute-center">
                <button
                    type="button"
                    class="slds-button comm-passwordless-login-form__underline"
                    onclick={resendOTP}
                    data-automation="resendButton">
                    {labels.resendButton}
                </button>
            </div>
        </template>
        <div class="slds-p-bottom_x-small slds-align_absolute-center">
            <button
                type="button"
                class="slds-button comm-passwordless-login-form__underline"
                onclick={switchToEmail}
                data-automation="switchEmailButton">
                {labels.switchEmailButton}
            </button>
        </div>
        <div class="slds-p-bottom_x-large slds-align_absolute-center">
            <button
                type="button"
                class="slds-button comm-passwordless-login-form__underline"
                onclick={guestCheckout}
                data-automation="guestCheckoutButton">
                {labels.guestCheckout}
            </button>
        </div>
    </lightning-modal-body>
</template>
