<template lwc:render-mode="light">
    <section class="slds-card">
        <header class="slds-card__header slds-grid slds-grid_vertical-align-center">
            <div class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__body">
                    <h2
                        class="slds-card__header-title slds-truncate"
                        title={computedTitle}>
                        {computedTitle}
                    </h2>
                </div>
            </div>
        </header>

        <div class="slds-card__body slds-card__body_inner">
            <template if:true={hasNotes}>
                <template
                    for:each={computedNotes}
                    for:item="note">
                    <article
                        key={note.id}
                        class="slds-media slds-m-vertical_medium">
                        <div class="slds-media__figure">
                            <span
                                class="slds-avatar slds-avatar_circle slds-avatar_large"
                                title={note.authorName}>
                                <span class="slds-avatar__initials slds-icon-custom-27 slds-text-color_inverse">
                                    {note.authorInitials}
                                </span>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <header class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                <h3
                                    class="slds-text-heading_small slds-text-title_bold slds-truncate"
                                    title={note.authorName}>
                                    {note.authorName}
                                </h3>
                                <span class="slds-m-horizontal_x-small">•</span>
                                <span class="slds-text-color_weak slds-truncate">{note.timestamp}</span>
                            </header>

                            <p class="slds-text-longform slds-m-bottom_small">{note.body}</p>

                            <hr class="slds-m-top_medium" />
                        </div>
                    </article>
                </template>
            </template>
