<template lwc:render-mode="light">
    <div class="order-template-list-sort-dropdown">
        <span class="sort-label">{label}:</span>
        <lightning-button-menu
            icon-name="utility:chevrondown"
            label={selectedLabel}
            menu-alignment="left"
            variant="bare"
            class="sort-button-menu"
            alternative-text={label}
            onselect={handleSortChange}>
            <template
                for:each={sortingOptions}
                for:item="option">
                <lightning-menu-item
                    key={option.value}
                    value={option.value}
                    label={option.label}
                    checked={option.checked}
                    class="sort-menu-item"></lightning-menu-item>
            </template>
        </lightning-button-menu>
    </div>
</template>
