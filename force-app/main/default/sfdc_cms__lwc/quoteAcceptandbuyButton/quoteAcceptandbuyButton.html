<template lwc:render-mode="light">
    <template lwc:if={shouldShowButton}>
        <site-common-button-ui
            data-test-id="quote-accept-and-buy-button"
            variant={variant}
            width={width}
            size={size}
            disabled={isDisabled}
            onclick={handleButtonClick}>
            {content}
        </site-common-button-ui>
    </template>
</template>
