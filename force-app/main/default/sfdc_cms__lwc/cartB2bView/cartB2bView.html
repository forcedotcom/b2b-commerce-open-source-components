<template lwc:render-mode="light">
    <site-cart-view
        display-states={displayStates}
        items={items}
        cart-details={cartDetails}
        messages={messages}
        show-sort-options={showSortOptions}
        new-cart-button-label={newCartButtonLabel}
        cart-name-label={cartNameLabel}
        cart-description-label={cartDescriptionLabel}
        default-pill-label={defaultPillLabel}
        options-dropdown-label={optionsDropdownLabel}
        edit-cart-label={editCartLabel}
        mark-as-default-label={markAsDefaultLabel}
        delete-cart-label={deleteCartLabel}>
        <slot
            name="emptyHeaderLabel"
            slot="emptyHeaderLabel"></slot>
        <slot
            name="emptyBody"
            slot="emptyBody"></slot>
        <slot
            name="emptyStateBreadcrumb"
            slot="emptyStateBreadcrumb"></slot>
        <slot
            name="itemsBreadcrumb"
            slot="itemsBreadcrumb"></slot>
        <slot
            name="itemsHeaderLabel"
            slot="itemsHeaderLabel"></slot>
        <slot
            name="itemsHeaderCount"
            slot="itemsHeaderCount"></slot>
        <slot
            name="itemsDescription"
            slot="itemsDescription"></slot>
        <slot
            name="emptyStateDescription"
            slot="emptyStateDescription"></slot>
        <slot
            name="promotionDiscountsApproaching"
            slot="promotionDiscountsApproaching"></slot>
        <slot
            name="itemsBody"
            slot="itemsBody"></slot>
    </site-cart-view>
</template>
