<template lwc:render-mode="light">
    <div class="slds-grid slds-gutters subscription-action-history-card">
        <div class="slds-col slds-size_1-of-12">
            <svg
                class="slds-icon slds-icon_small"
                aria-hidden="true">
                <use xlink:href={statusIcon}></use>
            </svg>
        </div>
        <div class="slds-col slds-size_11-of-12">
            <div class="slds-text-heading_small slds-m-bottom_x-small">
                <strong>{mainText}</strong>
            </div>
            <template lwc:if={fromToTextExist}>
                <div class="slds-text-body_regular">
                    <span class="fromText">{fromText}</span>
                    <span>{toText}</span>
                </div>
            </template>
            <div class="slds-text-body_regular slds-m-top_x-small">{displayDateTime}</div>
            <hr class="slds-m-top_large slds-m-bottom_large" />
        </div>
    </div>
</template>
