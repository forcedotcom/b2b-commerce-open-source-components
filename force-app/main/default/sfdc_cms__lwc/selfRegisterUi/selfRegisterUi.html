<template lwc:render-mode="light">
    <section class="comm-self-register__container slds-card slds-card_inner slds-col slds-grow slds-p-around_medium">
        <lightning-spinner
            class="comm-self-register-form__spinner"
            lwc:if={isLoading}
            alternative-text="Loading"
            size="large"></lightning-spinner>
        <site-common-error
            lwc:if={showError}
            error-label={errorMessage}
            error-type="error"></site-common-error>

        <fieldset class="slds-form-element slds-form_compound">
            <div class="slds-form-element__control">
                <!--TODO: optimization: onkeypress events can move up to the parent (W-6246505)-->
                <!--TODO: optimization: check if we can use class selectors for the following fields, instead of data attributes (W-6246505)-->
                <lightning-input
                    class="comm-self-register__first-name-input"
                    data-firstname
                    type="text"
                    label={firstnameLabel}
                    onkeypress={handleKeyDown}
                    onchange={handleFirstNameChange}
                    autocomplete="given-name"
                    value={firstName}></lightning-input>
                <lightning-input
                    class="comm-self-register__last-name-input"
                    data-lastname
                    data-validate
                    type="text"
                    label={lastnameLabel}
                    onkeypress={handleKeyDown}
                    onchange={handleLastNameChange}
                    autocomplete="family-name"
                    required
                    value={lastName}></lightning-input>
                <lightning-input
                    class="comm-self-register__email-input"
                    data-email
                    data-validate
                    type="email"
                    label={emailLabel}
                    onkeypress={handleKeyDown}
                    onchange={handleEmailChange}
                    autocomplete="email"
                    required
                    value={email}></lightning-input>
                <template lwc:if={showPhoneNumberField}>
                    <site-checkout-multi-country-phone-field
                        data-phonenumber
                        data-validate
                        phone-number-label={phoneNumberLabel}
                        raw-internationalization-data={rawInternationalizationData}
                        country={phoneDefaultCountry}
                        phone-number={phoneNumber}
                        phone-number-required={phoneNumberRequired}
                        oncommit={handlePhoneNumberChange}></site-checkout-multi-country-phone-field>
                </template>
                <template lwc:if={extraFieldsJsonArray}>
                    <template
                        for:each={extraFieldsJsonArray}
                        for:item="currField">
                        <lightning-input
                            class="comm-self-register__extra-field-input"
                            data-extra-field
                            type="text"
                            label={currField.label}
                            key={currField.fieldPath}></lightning-input>
                    </template>
                </template>
                <template lwc:if={includePasswordField}>
                    <lightning-input
                        class="comm-self-register__password-input"
                        data-password
                        data-validate
                        type="password"
                        label={passwordLabel}
                        onkeypress={handleKeyDown}
                        onchange={handlePasswordChange}
                        autocomplete="new-password"
                        required
                        value={pword}></lightning-input>
                    <lightning-input
                        lwc:ref="confirmPassword"
                        class="comm-self-register__confirm-password-input"
                        data-confirm-password
                        data-validate
                        type="password"
                        label={confirmPasswordLabel}
                        onkeypress={handleKeyDown}
                        onchange={handleConfirmPasswordChange}
                        autocomplete="new-password"
                        required
                        value={confirmPword}></lightning-input>
                </template>
            </div>
        </fieldset>
        <div if:true={isConsentListAvailable}>
            <site-legal-consent-options consent-items={emailConsentOptions}></site-legal-consent-options>
            <slot name="footer"></slot>
        </div>
        <div class="slds-form-element slds-m-top_large slds-m-bottom_large">
            <div class="slds-form-element__control">
                <button
                    data-submitbtn
                    type="button"
                    class="comm-self-register__submit-button slds-button slds-button_brand slds-button_stretch"
                    onclick={submit}>
                    {submitButtonLabel}
                </button>
            </div>
        </div>
        <footer class="slds-form-element slds-m-top_large slds-text-align_center">
            <div class="slds-form-element__control comm-self-register__link-section">
                <a
                    class="comm-self-register__cancel-link"
                    href="javascript:void(0)"
                    variant="base"
                    onclick={cancel}>
                    {cancelLinkLabel}
                </a>
            </div>
        </footer>
    </section>
</template>
