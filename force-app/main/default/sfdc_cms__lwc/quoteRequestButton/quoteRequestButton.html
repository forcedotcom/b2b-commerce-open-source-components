<template lwc:render-mode="light">
    <template lwc:if={shouldShowQuoteRequestButton}>
        <site-common-button-ui
            data-test-id="quote-request-button"
            variant={variant}
            width={width}
            size={size}
            disabled={isDisabled}
            onclick={handleRequestQuote}>
            {content}
        </site-common-button-ui>
    </template>
</template>
