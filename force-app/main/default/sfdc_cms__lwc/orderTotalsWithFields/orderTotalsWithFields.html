<template lwc:render-mode="light">
    <site-order-totals
        title-text={titleText}
        fields={_fieldsData}
        discounts={filteredDiscounts}
        total-discount={totalDiscount}
        currency-code={_currencyCode}
        show-horizontal-line-above-last-field={showHorizontalLineAboveLastField}
        show-last-field-as-bold={showLastFieldAsBold}
        hide-title={hideTitle}
        hide-field-value-separator={hideFieldValueSeparator}></site-order-totals>
</template>
