<template>
    <lightning-modal-header label={_headerLabel}></lightning-modal-header>

    <lightning-modal-body>
        <!-- Always-present live region so screen readers announce the loading/saving transition (SC 4.1.3) -->
        <div
            role="status"
            aria-live="polite"
            class="slds-assistive-text">
            <template lwc:if={_isSaving}>{_spinnerHelpText}</template>
            <template lwc:elseif={_showLoading}>{_loadingLabel}</template>
        </div>

        <!-- Saving spinner -->
        <div
            lwc:if={_isSaving}
            class="modal-contents slds-p-vertical_x-large">
            <div class="slds-align_absolute-center slds-is-relative spinner-container">
                <lightning-spinner
                    aria-hidden="true"
                    alternative-text={_spinnerHelpText}></lightning-spinner>
            </div>
            <h2 class="slds-text-align_center slds-text-heading_small">{_spinnerHelpText}</h2>
        </div>

        <!-- View: Select existing template -->
        <div lwc:elseif={_showSelectView}>
            <!-- Loading templates -->
            <div
                lwc:if={_showLoading}
                class="modal-contents slds-p-vertical_x-large">
                <div class="slds-align_absolute-center slds-is-relative spinner-container">
                    <lightning-spinner
                        aria-hidden="true"
                        alternative-text={_loadingLabel}></lightning-spinner>
                </div>
                <h2 class="slds-text-align_center slds-text-heading_small">{_loadingLabel}</h2>
            </div>

            <!-- Error -->
            <div
                lwc:elseif={_showError}
                class="save-template-modal-body slds-text-align_center"
                role="alert">
                <p>{_errorLabel}</p>
            </div>

            <!-- Dropdown -->
            <div
                lwc:elseif={_showDropdown}
                class="save-template-modal-body">
                <lightning-combobox
                    label={_dropdownLabel}
                    placeholder={_dropdownPlaceholder}
                    options={_dropdownOptions}
                    onchange={handleDropdownChange}
                    required></lightning-combobox>
            </div>
        </div>

        <!-- View: Create new template -->
        <div lwc:elseif={_showCreateView}>
            <div class="save-template-modal-body">
                <button
                    type="button"
                    class="go-back-link slds-m-bottom_medium"
                    onclick={handleGoBack}>
                    <lightning-icon
                        icon-name="utility:chevronleft"
                        size="xx-small"
                        class="go-back-icon slds-current-color"
                        aria-hidden="true"></lightning-icon>
                    {_goBackLabel}
                </button>

                <lightning-input
                    data-name="name"
                    label={_templateNameLabel}
                    value={_newTemplateName}
                    onchange={handleNameChange}
                    onblur={handleNameBlur}
                    required
                    class="slds-p-bottom_medium"
                    data-validate="true"></lightning-input>

                <lightning-textarea
                    data-name="templateDescription"
                    label={_templateDescriptionLabel}
                    value={_newTemplateDescription}
                    onchange={handleDescriptionChange}
                    data-validate="true"></lightning-textarea>
            </div>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer lwc:if={_isNotLoading}>
        <div class="footer-content-container">
            <site-common-button-ui
                variant="secondary"
                width="stretch"
                assistive-text={_cancelButtonLabel}
                name="closeModalButton"
                onclick={handleClose}>
                {_cancelButtonLabel}
            </site-common-button-ui>
            <site-common-button-ui
                variant="primary"
                width="stretch"
                disabled={_isConfirmButtonDisabled}
                assistive-text={_confirmButtonLabel}
                name="saveTemplateButton"
                onclick={handleConfirm}>
                {_confirmButtonLabel}
            </site-common-button-ui>
        </div>
    </lightning-modal-footer>
</template>
