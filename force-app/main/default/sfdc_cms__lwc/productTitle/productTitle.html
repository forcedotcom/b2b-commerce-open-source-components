<template lwc:render-mode="light">
    <template lwc:if={htmlProductNameGate}>
        <h3>
            <a
                if:true={_isNavigable}
                href={url}
                data-productid={productId}
                onclick={navigateToProductDetailPage}>
                <lightning-formatted-rich-text value={productName}></lightning-formatted-rich-text>
            </a>
            <span if:false={_isNavigable}>
                <lightning-formatted-rich-text value={_productNameWithInvalidLabel}></lightning-formatted-rich-text>
            </span>
        </h3>
    </template>
    <template lwc:else>
        <h3>
            <a
                if:true={_isNavigable}
                href={url}
                data-productid={productId}
                onclick={navigateToProductDetailPage}>
                {productName}
            </a>
            <span if:false={_isNavigable}>{_productNameWithInvalidLabel}</span>
        </h3>
    </template>
</template>
