<template lwc:render-mode="light">
    <template lwc:if={_isLoading}>
        <div class={_subHeadingBodyContainerClassGenerator}>
            <div class="slds-align_absolute-center slds-is-relative spinner-container">
                <lightning-spinner alternative-text=""></lightning-spinner>
            </div>
            <h2 class="slds-text-align_center slds-text-heading_small"><b>{_spinnerHelpText}</b></h2>
        </div>
    </template>
    <template lwc:else>
        <div class={_subHeadingBodyContainerClassGenerator}>
            <lightning-icon
                lwc:if={_showIcon}
                src={_getCustomIcon}
                size="large"
                alternative-text=""
                class={_iconClassGenerator}></lightning-icon>
            <div>
                <h2
                    class="slds-text-align_center slds-text-heading_small"
                    data-id="modal-subheading">
                    <b>{_modalSubheading}</b>
                </h2>
            </div>
        </div>

        <h3
            lwc:if={_showSubheadings}
            class="slds-p-top_medium slds-p-horizontal_small sub-heading-helper-text">
            {_unavailableItemsText}
        </h3>
        <ul
            lwc:if={_unavailableProducts}
            class="scrollable">
            <li
                for:each={_unaddedProductList}
                for:item="unaddedProduct"
                key={unaddedProduct.productId}
                class="slds-p-around_small">
                <div class="slds-grid unadded-product-line-item">
                    <div class="image-area">
                        <figure>
                            <experience-picture
                                lwc:if={unaddedProduct.image.available}
                                url={unaddedProduct.image.url}
                                images={unaddedProduct.image.images}
                                alternative-text={unaddedProduct.image.alternateText}></experience-picture>
                            <svg
                                lwc:else
                                viewBox="0 0 100 100"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <g clip-path="url(#clip0_2738_14955)">
                                    <rect
                                        style="height: 100%; width: 100%"
                                        rx="3"
                                        fill="#F7F9FA" />
                                    <path
                                        fill-rule="evenodd"
                                        clip-rule="evenodd"
                                        d="M69.8461 36.7691C69.8461 34.9499 68.3577 33.4614 66.5384 33.4614H33.4615C31.6423 33.4614 30.1538 34.9499 30.1538 36.7691V63.2307C30.1538 65.0499 31.6423 66.5383 33.4615 66.5383H66.5384C68.3577 66.5383 69.8461 65.0499 69.8461 63.2307V36.7691ZM61.2461 59.9223H37.2653C36.273 59.9223 35.6942 58.8473 36.1903 58.0204L43.4672 45.3685C43.798 44.7896 44.5422 44.7896 44.873 45.3685L49.2557 52.8935C49.5865 53.3896 50.3307 53.4723 50.6615 52.9762L54.2172 47.8493C54.548 47.3531 55.2922 47.3531 55.623 47.8493L62.1557 58.2685C62.6519 59.0127 62.1557 59.9223 61.2461 59.9223ZM59.0961 45.0384C57.2768 45.0384 55.7884 43.5499 55.7884 41.7307C55.7884 39.9115 57.2768 38.423 59.0961 38.423C60.9153 38.423 62.4038 39.9115 62.4038 41.7307C62.4038 43.5499 60.9153 45.0384 59.0961 45.0384Z"
                                        fill="#707275" />
                                </g>
                                <defs>
                                    <clipPath id="clip0_2738_14955">
                                        <rect
                                            style="height: 100%; width: 100%"
                                            fill="#F7F9FA" />
                                    </clipPath>
                                </defs>
                            </svg>
                        </figure>
                    </div>
                    <div class="unadded-product-list-column">
                        <lightning-formatted-rich-text
                            class="unadded-product-text unadded-product-heading-text slds-p-left_large"
                            value={unaddedProduct.productName}></lightning-formatted-rich-text>
                        <lightning-formatted-rich-text
                            class="unadded-product-text slds-p-left_large"
                            value={unaddedProduct.productSKU}></lightning-formatted-rich-text>
                        <lightning-formatted-rich-text
                            class="unadded-product-text slds-p-left_large error-message"
                            value={unaddedProduct.errorMessage}></lightning-formatted-rich-text>
                    </div>
                </div>
            </li>
        </ul>
    </template>
</template>
