<template lwc:render-mode="light">
    <site-subscription-card-v2
        item={item}
        child-subscriptions-data={_childSubscriptionsData}
        child-subscriptions-error={_childSubscriptionsError}
        show-child-subscriptions={_showChildSubscriptions}
        show-quantity={showQuantity}
        quantity-label={quantityLabel}
        show-start-date={showStartDate}
        start-date-label={startDateLabel}
        show-end-date={showEndDate}
        end-date-label={endDateLabel}
        show-next-billing-date={showNextBillingDate}
        next-billing-date-label={nextBillingDateLabel}
        tax-label={subscriptionTaxLabel}
        cancelled-pill-label={cancelledPillLabel}
        expired-pill-label={expiredPillLabel}
        amend-button-label={amendButtonLabel}
        view-history-button-label={viewHistoryButtonLabel}
        cancel-button-label={cancelButtonLabel}
        renew-button-label={renewButtonLabel}
        renew-section-title={renewSectionTitle}
        renew-section-description={renewSectionDescription}
        retry-cancel-button-label={retryCancelButtonLabel}
        icon-base-path={iconBasePath}
        product-url={_productUrl}
        rlm-subscription-enabled={_rlmSubscriptionEnabled}
        is-rendered-in-modal={_isRenderedInModal}
        show-subscription-actions
        style={_customStyles}
        oncancel={handleCancel}
        onamend={handleAmend}
        onrenew={handleRenew}
        onviewhistory={handleViewHistory}
        onnavigatetoproduct={handleProductNavigation}
        onaddorupdatesavedpaymentmethod={handleAddOrUpdateSavedPaymentMethod}></site-subscription-card-v2>
</template>
