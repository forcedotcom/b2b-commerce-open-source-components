<template lwc:render-mode="light">
    <a
        href={productUrl}
        title={tooltipText}
        onclick={handleProductDetailPageNavigation}
        class="productSuggestionCardContainer">
        <div class="productSuggestionCardImageArea">
            <figure class="imageArea">
                <experience-picture
                    url={image.url}
                    images={image.images}
                    alternative-text={image.alternateText}></experience-picture>
            </figure>
        </div>
        <div class="productSuggestionCardDetailsArea">
            <div class="slds-text-body_medium productSuggestionCardProductNameArea">{displayData.name}</div>
            <site-product-pricing-details-ui
                lwc:if={pricingInfo}
                class="slds-text-align_left productSuggestionCardPricing"
                product-pricing={pricingInfo}
                pricing-type="2_TIER"></site-product-pricing-details-ui>
        </div>
    </a>
</template>
