<template lwc:render-mode="light">
    <commerce-product-card
        data-automation="test-builder-product-card"
        card-layout={cardLayout}
        html-product-name-gate={htmlProductNameGate}
        image={_image}
        sku={_sku}
        list-images={listImages}
        sku-label={skuLabel}
        product-name={_productName}
        product-variants={_productVariants}
        primary-price={_primaryPrice}
        product-url={_productUrl}
        product-id={_productId}
        secondary-price={_secondaryPrice}
        currency={_currency}
        is-product-available={_isProductAvailable}
        show-add-to-cart-button={showAddToCartButton}
        show-button-on-desktop={showButtonOnDesktop}
        show-button-on-mobile={showButtonOnMobile}
        add-to-cart-button-label={_addToCartButtonLabel}
        add-to-cart-button-style={addToCartButtonStyle}
        add-to-cart-button-size={addToCartButtonSize}
        unavailable-price-label={unavailablePriceLabel}
        is-on-wishlist={isOnWishlist}
        onaddtocart={handleAddToCart}
        onquantitychanged={handleQuantityChanged}
        onproductclicked={handleProductClicked}
        onwishlistbuttonclicked={handleWishlistButtonClicked}
        style={_customStyles}
        image-hover-action={imageHoverAction}
        promotional-pricing={promotionalPricing}
        combine-promos-threshold={combinePromosThreshold}
        show-wishlist-icon={_wishlistIconVisible}
        wishlist-icon-unselected-color={wishlistIconUnselectedColor}
        wishlist-icon-selected-color={wishlistIconSelectedColor}
        display-alternative-wishlist-remove-icon={isWishlistPage}
        wishlist-item-id={_wishlistItemId}
        view-product-options-button-label={viewProductOptionsButtonLabel}
        product-class={_productClass}
        is-configuration-allowed={_isConfigurationAllowed}
        is-subscription-product={_isSubscriptionProduct}
        subscription-options-label={_subscriptionOptionsLabel}
        show-product-quick-view={displayQuickViewButton}
        show-wishlist-in-quick-view={showWishlistInQuickView}
        product-quick-view-button-label={productQuickViewButtonLabel}
        product-variation-info-data={productVariationInfoData}
        additional-fields={_additionalFields}
        show-quantity-selector={showQuantitySelector}
        quantity-minimum={quantityMinimum}
        quantity-maximum={quantityMaximum}
        quantity-step={quantityStep}
        minimum-value-guide-text={minimumValueGuideText}
        maximum-value-guide-text={maximumValueGuideText}
        increment-value-guide-text={incrementValueGuideText}
        show-quantity-rules-text={showQuantityRulesText}></commerce-product-card>
</template>
