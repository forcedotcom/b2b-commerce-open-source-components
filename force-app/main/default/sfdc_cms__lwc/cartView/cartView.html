<template lwc:render-mode="light">
    <!-- Empty cart state -->
    <template lwc:if={showEmptyState}>
        <!-- Create Cart button Mobile View-->
        <div class="cart-view-create-cart-mobile-view">
            <div class="cart-view-create-cart-button-wrapper">
                <site-cart-create-button
                    new-cart-button-label={newCartButtonLabel}
                    cart-name-label={cartNameLabel}
                    cart-description-label={cartDescriptionLabel}
                    navigate-to-new-cart></site-cart-create-button>
            </div>
            <site-cart-options
                cart-data={normalisedCartDetails}
                variant="container"
                cart-name-label={cartNameLabel}
                cart-description-label={cartDescriptionLabel}
                options-dropdown-label={optionsDropdownLabel}
                edit-cart-label={editCartLabel}
                mark-as-default-label={markAsDefaultLabel}
                delete-cart-label={deleteCartLabel}
                oncartupdated={handleReloadAfterCartMetadataChange}
                oncartdeleted={handleCartDeleted}
                oncartprimarychanged={handleReloadAfterCartMetadataChange}></site-cart-options>
        </div>

        <!-- Breadcrumb for empty cart state-->
        <nav
            class="breadcrumb"
            data-automation="emptyStateBreadcrumb">
            <slot name="emptyStateBreadcrumb"></slot>
        </nav>

        <!-- Cart header with default label and actions -->
        <header class="cart-header cart-header-with-actions">
            <div
                class="cart-header-content"
                data-automation="emptyHeaderLabel">
                <slot name="emptyHeaderLabel"></slot>
            </div>
            <div
                class="cart-header-actions"
                data-automation="cartHeaderActions">
                <!-- Default pill -->
                <site-common-pill
                    lwc:if={_showDefaultPill}
                    label-text={_defaultPillLabel}
                    class="cart-header-pill cart-pill-desktop"></site-common-pill>
                <!-- Create Cart button -->
                <site-cart-create-button
                    new-cart-button-label={newCartButtonLabel}
                    cart-name-label={cartNameLabel}
                    cart-description-label={cartDescriptionLabel}
                    navigate-to-new-cart
                    class="cart-header-new-cart-button"></site-cart-create-button>
                <!-- Cart Options Menu (desktop; mobile uses cart-view-create-cart-mobile-view) -->
                <site-cart-options
                    class="cart-view-cart-options--header"
                    cart-data={normalisedCartDetails}
                    variant="container"
                    cart-name-label={cartNameLabel}
                    cart-description-label={cartDescriptionLabel}
                    options-dropdown-label={optionsDropdownLabel}
                    edit-cart-label={editCartLabel}
                    mark-as-default-label={markAsDefaultLabel}
                    delete-cart-label={deleteCartLabel}
                    oncartupdated={handleReloadAfterCartMetadataChange}
                    oncartdeleted={handleCartDeleted}
                    oncartprimarychanged={handleReloadAfterCartMetadataChange}></site-cart-options>
            </div>
        </header>
        <!-- Cart description -->
        <template lwc:if={hasDescription}>
            <div class="cart-description-row">
                <section
                    class="cart-description"
                    data-automation="emptyStateDescription">
                    <slot name="emptyStateDescription"></slot>
                </section>
                <site-common-pill
                    lwc:if={_showDefaultPill}
                    label-text={_defaultPillLabel}
                    class="cart-description-pill cart-header-pill"></site-common-pill>
            </div>
        </template>
        <!-- Visual divider between header and empty state content -->
        <div
            class="section-divider"
            aria-hidden="true"></div>

        <!-- Empty cart illustration and body content -->
        <section class="empty">
            <div
                class="empty-body"
                data-automation="emptyBody">
                <img
                    src={_emptyCartImageUrl}
                    width="280"
                    height="206"
                    aria-hidden="true" />
                <slot name="emptyBody"></slot>
            </div>
        </section>
    </template>

    <!-- Items state -->
    <template lwc:if={showItemState}>
        <section
            class="items"
            oncartupdatestatus={handleCartUpdateStatus}>
            <!-- Create Cart Button Mobile View -->
            <div
                class="cart-view-create-cart-mobile-view"
                lwc:if={isCartPresent}>
                <div class="cart-view-create-cart-button-wrapper">
                    <site-cart-create-button
                        new-cart-button-label={newCartButtonLabel}
                        cart-name-label={cartNameLabel}
                        cart-description-label={cartDescriptionLabel}
                        navigate-to-new-cart></site-cart-create-button>
                </div>
                <site-cart-options
                    cart-data={normalisedCartDetails}
                    variant="container"
                    cart-name-label={cartNameLabel}
                    cart-description-label={cartDescriptionLabel}
                    options-dropdown-label={optionsDropdownLabel}
                    edit-cart-label={editCartLabel}
                    mark-as-default-label={markAsDefaultLabel}
                    delete-cart-label={deleteCartLabel}
                    oncartupdated={handleReloadAfterCartMetadataChange}
                    oncartdeleted={handleCartDeleted}
                    oncartprimarychanged={handleReloadAfterCartMetadataChange}></site-cart-options>
            </div>

            <!-- Breadcrumb for cart with items -->
            <template lwc:if={isCartPresent}>
                <nav
                    class="breadcrumb"
                    data-automation="itemsBreadcrumb">
                    <slot name="itemsBreadcrumb"></slot>
                </nav>
            </template>
            <!-- Cart level messages -->
            <site-common-scoped-notification
                lwc:if={message}
                class="slds-m-bottom_small"
                data-automation="cartMessage"
                header-text={message.message}
                type={messageSeverity}></site-common-scoped-notification>

            <!-- Cart header label, item count, and actions -->
            <header class="cart-header cart-header-with-actions">
                <div class="cart-header-content">
                    <div class="cart-header-title-row">
                        <div
                            class="cart-header-item"
                            data-automation="itemsHeaderLabel">
                            <slot name="itemsHeaderLabel"></slot>
                        </div>
                        <div
                            class="cart-header-item"
                            data-automation="itemsHeaderCount">
                            <slot name="itemsHeaderCount"></slot>
                        </div>
                    </div>
                </div>

                <div
                    class="cart-header-actions"
                    data-automation="cartHeaderActions">
                    <!-- Default pill -->
                    <site-common-pill
                        lwc:if={_showDefaultPill}
                        label-text={_defaultPillLabel}
                        class="cart-header-pill cart-pill-desktop"></site-common-pill>
                    <site-cart-create-button
                        lwc:if={isCartPresent}
                        new-cart-button-label={newCartButtonLabel}
                        cart-name-label={cartNameLabel}
                        cart-description-label={cartDescriptionLabel}
                        navigate-to-new-cart
                        class="cart-header-new-cart-button"></site-cart-create-button>
                    <!-- Cart Options Menu (desktop; mobile uses cart-view-create-cart-mobile-view) -->
                    <site-cart-options
                        class="cart-view-cart-options--header"
                        cart-data={normalisedCartDetails}
                        variant="container"
                        cart-name-label={cartNameLabel}
                        cart-description-label={cartDescriptionLabel}
                        options-dropdown-label={optionsDropdownLabel}
                        edit-cart-label={editCartLabel}
                        mark-as-default-label={markAsDefaultLabel}
                        delete-cart-label={deleteCartLabel}
                        oncartupdated={handleReloadAfterCartMetadataChange}
                        oncartdeleted={handleCartDeleted}
                        oncartprimarychanged={handleReloadAfterCartMetadataChange}></site-cart-options>
                </div>
            </header>

            <template lwc:if={hasDescription}>
                <div class="cart-description-row">
                    <!-- Cart description mobile view -->
                    <section
                        class="cart-description"
                        data-automation="itemsDescription">
                        <slot name="itemsDescription"></slot>
                    </section>
                    <!-- Default pill mobile view -->
                    <site-common-pill
                        lwc:if={_showDefaultPill}
                        label-text={_defaultPillLabel}
                        class="cart-description-pill cart-header-pill"></site-common-pill>
                </div>
            </template>
            <!-- Visual divider between header and items content -->
            <div
                class="section-divider"
                aria-hidden="true"></div>
            <!-- Sort options dropdown-->
            <template lwc:if={showSortOptions}>
                <div class="sort-container">
                    <lightning-combobox
                        lwc:ref="sortMenu"
                        class="sort-menu"
                        label={_labels.sortByLabelText}
                        value={selectedSortOrder}
                        options={sortOptions}
                        onchange={handleSortChange}></lightning-combobox>
                </div>
            </template>
            <!-- Approaching Discounts threshold message -->
            <section data-automation="promotionDiscountsApproaching">
                <slot name="promotionDiscountsApproaching"></slot>
            </section>
            <!-- Cart items list -->
            <section data-automation="itemsBody">
                <slot name="itemsBody"></slot>
            </section>
        </section>
    </template>

    <!-- Spinner shown when cart data is loading -->
    <div
        lwc:if={showSpinner}
        class="cart-spinner slds-spinner_container"
        role="status"
        size="large"
        variant="brand">
        <div part="backdrop"></div>
        <div
            class="slds-spinner slds-spinner_brand slds-spinner_large"
            role="status"
            part="spinner">
            <span class="slds-assistive-text">{_labels.alternativeSpinnerText}</span>
            <div
                part="dot-a"
                class="slds-spinner__dot-a"></div>
            <div
                part="dot-b"
                class="slds-spinner__dot-b"></div>
        </div>
    </div>
</template>
